<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>DARKFLOW OTC - Dashboard de Risco 3D (Simulacao)</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            pointer-events: none;
            z-index: 100;
            font-size: 14px;
        }
        #title {
            position: absolute;
            bottom: 20px;
            left: 0;
            right: 0;
            text-align: center;
            color: white;
            background: rgba(0,0,0,0.5);
            padding: 5px;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="info">
        <strong>DARKFLOW OTC - Mesa de Risco (Simulacao)</strong><br>
        Exposicao da Corretora (R$ milhoes) | Pico entre 18h-23h
    </div>
    <div id="title">
        Baseado em indicador invertido: 96% SELL → 96% CALL real | Exposicao = Volume CALL - PUT
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.128.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.128.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050b1a);
        scene.fog = new THREE.FogExp2(0x050b1a, 0.003);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(15, 12, 18);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const labelRenderer = new CSS2DRenderer();
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.domElement.style.position = 'absolute';
        labelRenderer.domElement.style.top = '0px';
        labelRenderer.domElement.style.left = '0px';
        labelRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(labelRenderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.autoRotate = false;
        controls.enableZoom = true;
        controls.target.set(0, 5, 0);

        const ambientLight = new THREE.AmbientLight(0x404060);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 1);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        dirLight.receiveShadow = false;
        scene.add(dirLight);
        const backLight = new THREE.PointLight(0x4466cc, 0.3);
        backLight.position.set(-2, 5, -5);
        scene.add(backLight);

        const gridHelper = new THREE.GridHelper(30, 20, 0x88aaff, 0x335588);
        gridHelper.position.y = -0.5;
        scene.add(gridHelper);

        const axesHelper = new THREE.AxesHelper(12);
        axesHelper.material.transparent = true;
        axesHelper.material.opacity = 0.2;
        scene.add(axesHelper);

        const hours = [];
        const exposures = [];
        for (let h = 0; h <= 23; h++) {
            let exposure;
            if (h >= 18 && h <= 23) {
                const peakFactor = Math.sin((h - 18) / 5 * Math.PI / 2);
                exposure = 20 + peakFactor * 80;
                if (h === 20 || h === 21) exposure = 100;
                if (h === 22) exposure = 80;
                if (h === 23) exposure = 50;
            } else if (h >= 12 && h < 18) {
                exposure = 10 + (h - 12) * 2.5;
            } else if (h >= 6 && h < 12) {
                exposure = 5 + (h - 6) * 0.8;
            } else {
                exposure = 5 + Math.random() * 3;
            }
            exposure = Math.min(100, Math.max(5, exposure));
            hours.push(h);
            exposures.push(exposure);
        }

        const barWidth = 0.6;
        const barDepth = 0.6;
        const colors = [0x2ecc71, 0xf1c40f, 0xe67e22, 0xe74c3c];

        for (let i = 0; i < hours.length; i++) {
            const h = hours[i];
            const exp = exposures[i];
            const height = exp / 10;
            const x = (h - 11.5) * 1.0;

            let color;
            if (exp < 20) color = colors[0];
            else if (exp < 50) color = colors[1];
            else if (exp < 80) color = colors[2];
            else color = colors[3];

            const geometry = new THREE.BoxGeometry(barWidth, height, barDepth);
            const material = new THREE.MeshStandardMaterial({ color: color, roughness: 0.3, metalness: 0.1 });
            const bar = new THREE.Mesh(geometry, material);
            bar.position.set(x, height / 2, 0);
            bar.castShadow = true;
            bar.receiveShadow = false;
            scene.add(bar);

            const edgesGeo = new THREE.EdgesGeometry(geometry);
            const edgesMat = new THREE.LineBasicMaterial({ color: 0xffffff });
            const wireframe = new THREE.LineSegments(edgesGeo, edgesMat);
            wireframe.position.copy(bar.position);
            scene.add(wireframe);

            const div = document.createElement('div');
            div.textContent = `${h}h\n${exp.toFixed(0)}M`;
            div.style.color = '#ccddff';
            div.style.fontSize = '10px';
            div.style.fontWeight = 'bold';
            div.style.textShadow = '1px 1px 0px black';
            div.style.backgroundColor = 'rgba(0,0,0,0.5)';
            div.style.padding = '2px 4px';
            div.style.borderRadius = '4px';
            div.style.border = '1px solid #4488ff';
            div.style.textAlign = 'center';
            const label = new CSS2DObject(div);
            label.position.set(x, height + 0.3, 0);
            scene.add(label);
        }

        const lineMaterial = new THREE.LineBasicMaterial({ color: 0xff6666 });
        const points = [];
        for (let i = -12; i <= 12; i += 0.5) {
            points.push(new THREE.Vector3(i, 10, 0));
        }
        const lineGeometry = new THREE.BufferGeometry().setFromPoints(points);
        const line = new THREE.Line(lineGeometry, lineMaterial);
        scene.add(line);

        const planeMat = new THREE.MeshStandardMaterial({ color: 0x112233, roughness: 0.8, metalness: 0.1 });
        const plane = new THREE.Mesh(new THREE.PlaneGeometry(26, 12), planeMat);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -0.5;
        plane.receiveShadow = true;
        scene.add(plane);

        const starGeometry = new THREE.BufferGeometry();
        const starCount = 800;
        const starPositions = new Float32Array(starCount * 3);
        for (let i = 0; i < starCount; i++) {
            starPositions[i * 3] = (Math.random() - 0.5) * 200;
            starPositions[i * 3 + 1] = (Math.random() - 0.5) * 80 + 10;
            starPositions[i * 3 + 2] = (Math.random() - 0.5) * 100 - 50;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({ color: 0xaaccff, size: 0.08 });
        const stars = new THREE.Points(starGeometry, starMaterial);
        scene.add(stars);

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', onWindowResize, false);
        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            labelRenderer.setSize(window.innerWidth, window.innerHeight);
        }

        console.log('Dashboard 3D carregado. Use o mouse para girar/zoom.');
    </script>
</body>
</html>
